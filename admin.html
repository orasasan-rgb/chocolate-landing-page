<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจัดการคลังสินค้า & พิมพ์ใบปะหน้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ตั้งค่าสำหรับการกดสั่งพิมพ์ใบปะหน้าพัสดุ */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; padding: 20px; }
    }
  </style>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">📦 ระบบหยิบสินค้าและแพ็คพัสดุ (Pick & Pack)</h1>
      <button onclick="loadOrders()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">รีเฟรชข้อมูล</button>
    </div>

    <!-- ตารางแสดงรายการออเดอร์ -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-800 text-white text-sm">
            <th class="p-3">Order ID</th>
            <th class="p-3">ลูกค้า</th>
            <th class="p-3">รายการหยิบสินค้า (Pick List)</th>
            <th class="p-3">ยอดเงิน</th>
            <th class="p-3">สถานะ</th>
            <th class="p-3">จัดการ</th>
          </tr>
        </thead>
        <tbody id="orderTable" class="divide-y text-sm">
          <tr><td colspan="6" class="p-4 text-center">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- พื้นที่สำหรับพิมพ์ใบจ่าหน้าพัสดุ (ซ่อนไว้จะแสดงตอนกดพิมพ์) -->
  <div id="printArea" class="hidden bg-white max-w-lg mx-auto mt-10 p-6 border-2 border-black">
    <div class="border-b-2 border-black pb-3 mb-3 flex justify-between">
      <div>
        <p class="font-bold text-lg">ผู้ส่ง (FROM):</p>
        <p class="text-sm">CACAO CRAFT THAILAND</p>
        <p class="text-sm">123 ถ.สุขุมวิท กรุงเทพฯ 10110 โทร. 02-000-0000</p>
      </div>
      <div class="text-right">
        <p class="font-bold" id="pOrderId"></p>
      </div>
    </div>
    <div class="py-4">
      <p class="font-bold text-lg">ผู้รับ (TO):</p>
      <p class="text-xl font-bold mt-1" id="pName"></p>
      <p class="text-lg font-semibold" id="pPhone"></p>
      <p class="text-base mt-2" id="pAddress"></p>
    </div>
    <div class="border-t-2 border-dashed border-black pt-3 mt-3 text-sm">
      <p class="font-bold">รายการสินค้าในกล่อง (Packing List):</p>
      <p id="pItems"></p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxy3MEvU0J2fkgu5-ZQ2WVXBmwly8jueLpESLTsLpPeKh1NjFD78PGBUpNf4pKH5BM/exec';
    let allOrders = [];

    function loadOrders() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          allOrders = data.reverse(); // เอาออเดอร์ล่าสุดขึ้นก่อน
          renderTable();
        });
    }

    function renderTable() {
      const tbody = document.getElementById('orderTable');
      tbody.innerHTML = '';
      
      allOrders.forEach((o, index) => {
        const isPacked = o.status === 'แพ็คแล้ว';
        tbody.innerHTML += `
          <tr class="${isPacked ? 'bg-green-50' : ''}">
            <td class="p-3 font-bold">${o.orderId}<br><span class="text-xs text-gray-400 font-normal">${o.timestamp}</span></td>
            <td class="p-3"><strong>${o.name}</strong><br>${o.phone}<br><span class="text-xs text-gray-500">${o.address}</span></td>
            <td class="p-3">
              ${o.sku1 > 0 ? `<div class="bg-stone-200 px-2 py-1 rounded mb-1 inline-block">Dark 75%: <b>${o.sku1}</b> แท่ง</div><br>` : ''}
              ${o.sku2 > 0 ? `<div class="bg-amber-200 px-2 py-1 rounded inline-block">Milk Sea Salt: <b>${o.sku2}</b> แท่ง</div>` : ''}
            </td>
            <td class="p-3 font-bold">฿${o.total}</td>
            <td class="p-3">
              <span class="px-2 py-1 rounded text-xs font-bold ${isPacked ? 'bg-green-600 text-white' : 'bg-yellow-400 text-black'}">
                ${o.status}
              </span>
            </td>
            <td class="p-3 space-y-1">
              <button onclick="printLabel(${index})" class="w-full bg-gray-800 text-white px-3 py-1 rounded text-xs hover:bg-black">🖨️ พิมพ์ใบปะหน้า</button>
              ${!isPacked ? `<button onclick="markAsPacked('${o.orderId}')" class="w-full bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700">✅ แพ็คเสร็จแล้ว</button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    function printLabel(index) {
      const o = allOrders[index];
      document.getElementById('pOrderId').innerText = o.orderId;
      document.getElementById('pName').innerText = o.name;
      document.getElementById('pPhone').innerText = 'โทร: ' + o.phone;
      document.getElementById('pAddress').innerText = o.address;
      
      let itemsText = [];
      if (o.sku1 > 0) itemsText.push(`- 75% Dark Chocolate (${o.sku1} แท่ง)`);
      if (o.sku2 > 0) itemsText.push(`- Sea Salt Milk Chocolate (${o.sku2} แท่ง)`);
      document.getElementById('pItems').innerHTML = itemsText.join('<br>');

      const printArea = document.getElementById('printArea');
      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    }

    function markAsPacked(orderId) {
      if(!confirm('ยืนยันว่าหยิบและแพ็คสินค้าออเดอร์ ' + orderId + ' เรียบร้อยแล้ว?')) return;
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: 'แพ็คแล้ว' })
      })
      .then(() => loadOrders());
    }

    loadOrders();
  </script>
</body>
</html>
